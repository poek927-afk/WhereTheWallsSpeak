<style>
  /* Layout: two full-height columns. Hovering (or focusing inside) a column
     widens it and the neighbour gives up space. Left = photo of the wall,
     right = contents styled as slap-tag stickers. The headline straddles both. */
  :root {
    --bg: #fdfdfc;
    --ink: #0b0b0b;
    --divider: #e4e2dc;
    --photo-bg: #000000;
    --photo-ink: #ffffff;
    --photo-shade: rgb(0 0 0 / 0.72);
    --photo-shade-soft: rgb(0 0 0 / 0.38);
    --sticker-ink: #141412;
    --sticker-yellow: #f4d84a;
    --sticker-white: #f2f0ea;
    --sticker-red: #f0634c;
    --sticker-green: #8fc9a0;
    --sticker-edge: rgb(0 0 0 / 0.28);
    --sticker-shadow: rgb(0 0 0 / 0.16);
    --sticker-shadow-deep: rgb(0 0 0 / 0.26);
    --peel-back: #dcd9d0;
    --focus: #0b0b0b;

    --font-display: "abolition", "Anton", Impact, "Arial Narrow", sans-serif;
    --font-body: "Merriweather", Georgia, serif;

    --grow: 1.7;
    --speed: 0.55s;
    --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0d;
      --ink: #f6f5f1;
      --divider: #2a2927;
      --sticker-shadow: rgb(0 0 0 / 0.45);
      --sticker-shadow-deep: rgb(0 0 0 / 0.65);
      --peel-back: #b9b5aa;
      --focus: #f6f5f1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0d;
    --ink: #f6f5f1;
    --divider: #2a2927;
    --sticker-shadow: rgb(0 0 0 / 0.45);
    --sticker-shadow-deep: rgb(0 0 0 / 0.65);
    --peel-back: #b9b5aa;
    --focus: #f6f5f1;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  .split {
    display: flex;
    height: 100%;
    min-height: 36rem;
  }
  .col {
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    position: relative;
    container-type: inline-size;
    transition: flex-grow var(--speed) var(--ease);
  }
  .col + .col { border-left: 1px solid var(--divider); }
  @media (hover: hover) {
    .col:hover { flex-grow: var(--grow); }
  }
  .col:focus-within { flex-grow: var(--grow); }

  /* ---------- Headline (split across both columns) ---------- */
  .headline {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 35cqi; /* Abolition is narrow, so it needs more size to span the column */
    line-height: 0.9;
    text-transform: uppercase;
    white-space: nowrap;
    margin: 0;
    padding: 0.06em 3cqi 0;
  }

  .layer.is-active { opacity: 1; transform: scale(1); }
  .layer-base    { background-size: cover; background-position: center; }
  .layer-history { background-size: 230% auto; background-position: 28% 33%; filter: grayscale(1) sepia(0.55) contrast(1.45); }
  .layer-styles  { background-size: 280% auto; background-position: 57% 44%; filter: saturate(1.8) contrast(1.08); }
  .layer-diy     { background-size: 270% auto; background-position: 47% 58%; filter: contrast(1.55) saturate(0.7); }

  .shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(to bottom, var(--photo-shade) 0%, var(--photo-shade-soft) 16%, transparent 34%);
  }
  .col-photo .headline {
    position: relative;
    color: var(--photo-ink);
  }

  /* ---------- Right column: contents as stickers ---------- */
  .col-contents {
    display: flex;
    flex-direction: column;
  }

  .contents {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 1.5rem 3cqi 2rem;
  }
  .stickers {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(1.1rem, 3.6vh, 2.2rem);
  }
  .stickers li:nth-child(1) { --rot: -1.6deg; --sticker: var(--sticker-yellow); --i: 0; }
  .stickers li:nth-child(2) { --rot:  1.1deg; --sticker: var(--sticker-white);  --i: 1; }
  .stickers li:nth-child(3) { --rot: -0.7deg; --sticker: var(--sticker-red);    --i: 2; }
  .stickers li:nth-child(4) { --rot:  1.8deg; --sticker: var(--sticker-green);  --i: 3; }

  .sticker {
    --peel: 0.85em;
    position: relative;
    display: inline-block;
    padding: 0.5em 1.45em 0.5em 1em; /* extra right room so the peel never covers text */
    background: var(--sticker);
    color: var(--sticker-ink);
    font-weight: 700;
    font-size: clamp(1.05rem, 5.6cqi, 2.1rem);
    line-height: 1.15;
    text-decoration: none;
    border-radius: 2px;
    transform: rotate(var(--rot));
    box-shadow:
      0 2px 0 var(--sticker-edge),
      0 6px 14px var(--sticker-shadow);
    transition:
      transform var(--speed) var(--ease),
      box-shadow var(--speed) var(--ease);
    animation: stick-on 0.6s var(--ease) backwards;
    animation-delay: calc(var(--i) * 90ms + 150ms);
  }
  /* Peeling corner: the page colour "cuts" the top-right triangle away and the
     other half shows the sticker's paper back. */
  .sticker::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: var(--peel);
    height: var(--peel);
    background: linear-gradient(to bottom left, var(--bg) 50%, var(--peel-back) 50%);
    box-shadow: -1px 1px 2px var(--sticker-shadow);
    border-bottom-left-radius: 2px;
    transition: width var(--speed) var(--ease), height var(--speed) var(--ease);
  }

  .sticker:hover,
  .sticker:focus-visible {
    --peel: 1.2em;
    transform: translateX(0.5rem) rotate(0deg) scale(1.03);
    box-shadow:
      0 3px 0 var(--sticker-edge),
      0 14px 26px var(--sticker-shadow-deep);
  }
  .sticker:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 4px;
  }

  .btn-title {
    position: fixed;
    left: 1rem;
    bottom: 1rem;
    z-index: 10;
    padding: 0.45em 0.9em;
    background: var(--sticker-yellow);
    color: var(--sticker-ink);
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    border-radius: 2px;
    transform: rotate(-1.6deg);
    box-shadow: 0 2px 0 var(--sticker-edge), 0 6px 14px var(--sticker-shadow);
    transition:
      transform var(--speed) var(--ease),
      box-shadow var(--speed) var(--ease);
  }
  .btn-title:hover,
  .btn-title:focus-visible {
    transform: rotate(0deg) scale(1.05);
    box-shadow: 0 3px 0 var(--sticker-edge), 0 12px 24px var(--sticker-shadow-deep);
  }
  .btn-title:focus-visible { outline: 3px solid var(--photo-ink); outline-offset: 4px; }

  @keyframes stick-on {
    from {
      transform: rotate(calc(var(--rot) * 4)) scale(1.35);
      opacity: 0;
    }
    60% { opacity: 1; }
    to {
      transform: rotate(var(--rot)) scale(1);
      opacity: 1;
    }
  }

  /* ---------- Narrow screens: stack, no growing ---------- */
  @media (max-width: 700px) {
    .split { flex-direction: column; height: auto; min-height: 0; }
    .col, .col:hover, .col:focus-within { flex: none; }
    .col + .col { border-left: 0; border-top: 1px solid var(--divider); }
    .col-photo { min-height: 26rem; }
    .headline { font-size: 31cqi; }
    .contents { padding: 1.5rem 1rem 2.5rem; }
    .sticker { font-size: 1.15rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>
<a class="btn-title" href="index.html">&larr; Back to title page</a>

<main class="split">
  <section class="col col-photo" aria-label="Photo of a graffiti-covered building at night">
    <div class="layer layer-base is-active" data-layer="base"></div>
    <div class="layer layer-history" data-layer="history"></div>
    <div class="layer layer-styles" data-layer="styles"></div>
    <div class="layer layer-diy" data-layer="diy"></div>
    <div class="shade"></div>
    <p class="headline" aria-hidden="true">Table of</p>
  </section>

  <section class="col col-contents" aria-label="Table of contents">
    <h1 class="headline">Contents</h1>
    <nav class="contents" aria-label="Sections">
      <ul class="stickers">
        <li><a class="sticker" href="Graffiti%20Intro.html" data-layer="base">Introduction</a></li>
        <li><a class="sticker" href="Graffiti%20History.html" data-layer="history">History of NYC Graffiti</a></li>
        <li><a class="sticker" href="Graffiti%20Tags.html" data-layer="styles">Styles of Graffiti</a></li>
        <li><a class="sticker" href="#diy" data-layer="diy">Do It Yourself</a></li>
      </ul>
    </nav>
  </section>
</main>

<script>
  // Hovering, focusing or clicking a sticker shows its part of the wall;
  // leaving the list puts the full photo back.
  (function () {
    var layers = document.querySelectorAll('.layer');
    var list = document.querySelector('.stickers');

    function show(name) {
      layers.forEach(function (l) {
        l.classList.toggle('is-active', l.dataset.layer === name);
      });
    }
    function reset() { show('base'); }

    document.querySelectorAll('.sticker').forEach(function (s) {
      function activate() { show(s.dataset.layer); }
      s.addEventListener('mouseenter', activate);
      s.addEventListener('focus', activate);
      // Placeholder (#) links just swap the photo; real page links navigate.
      s.addEventListener('click', function (e) {
        if (s.getAttribute('href').charAt(0) === '#') e.preventDefault();
        activate();
      });
    });
    list.addEventListener('mouseleave', reset);
    list.addEventListener('focusout', function (e) {
      if (!list.contains(e.relatedTarget)) reset();
    });
  })();
</script>
</body>
</html>
